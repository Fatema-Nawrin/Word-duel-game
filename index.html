<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Duel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #e8ecf3;
            --paper: #f7f9fc;
            --ink: #14213d;
            --muted: #56627f;
            --line: #ccd4e2;
            /* four team colours: fill, text on paper, dark avatar */
            --t0: #4f46e5;
            --t1: #b45309;
            --t2: #0f766e;
            --t3: #be185d;
            --t0t: #4338ca;
            --t1t: #92400e;
            --t2t: #0f766e;
            --t3t: #9d174d;
            --t0d: #2f2a9e;
            --t1d: #7a3606;
            --t2d: #0a4f4a;
            --t3d: #831843;
            --sel: rgba(20, 33, 61, 0.16);
            --danger: #b42318;
            --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
            --f-body: 'DM Sans', system-ui, sans-serif;
            --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e1424;
                --paper: #151d33;
                --ink: #e8ecf6;
                --muted: #98a3c0;
                --line: #2a3556;
                --t0: #5a5ee8;
                --t0t: #a9acff;
                --t1t: #fbbf6a;
                --t2t: #5eead4;
                --t3t: #f9a8d4;
                --sel: rgba(232, 236, 246, 0.22);
                --danger: #ff8a7a;
            }
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 var(--f-body);
        }

        .app {
            max-width: 1040px;
            margin: 0 auto;
            padding: 28px 16px 40px;
            display: grid;
            gap: 20px;
        }

        h1 {
            font: 800 clamp(2.2rem, 6vw, 3.2rem)/1 var(--f-display);
            letter-spacing: -0.03em;
            margin: 0;
        }

        .btn {
            font: inherit;
            font-weight: 700;
            padding: 0.65rem 1.1rem;
            border-radius: 8px;
            border: 2px solid var(--ink);
            background: var(--ink);
            color: var(--bg);
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.88;
        }

        :focus-visible {
            outline: 3px solid var(--t0);
            outline-offset: 2px;
        }

        .hint {
            margin: 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .err {
            margin: 0;
            color: var(--danger);
            font-weight: 500;
            min-height: 1.4em;
        }

        /* team colours: each element with a t0..t3 class picks up that team's colours */
        .t0 {
            --tc: var(--t0);
            --tct: var(--t0t);
            --tcd: var(--t0d);
        }

        .t1 {
            --tc: var(--t1);
            --tct: var(--t1t);
            --tcd: var(--t1d);
        }

        .t2 {
            --tc: var(--t2);
            --tct: var(--t2t);
            --tcd: var(--t2d);
        }

        .t3 {
            --tc: var(--t3);
            --tct: var(--t3t);
            --tcd: var(--t3d);
        }

        .a0 {
            --ac: var(--t0);
        }

        .a1 {
            --ac: var(--t1);
        }

        .a2 {
            --ac: var(--t2);
        }

        .a3 {
            --ac: var(--t3);
        }

        /* lobby */
        .join {
            display: grid;
            gap: 14px;
            max-width: 420px;
            background: var(--paper);
            border: 2px solid var(--line);
            border-radius: 10px;
            padding: 18px;
        }

        .field {
            display: grid;
            gap: 4px;
        }

        .field label {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field input,
        .field select {
            font: inherit;
            color: var(--ink);
            background: var(--bg);
            border: 2px solid var(--line);
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            width: 100%;
        }

        #code {
            font-family: var(--f-mono);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .modes {
            border: 0;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mode {
            position: relative;
            display: block;
        }

        .mode input {
            position: absolute;
            opacity: 0;
            inset: 0;
            margin: 0;
            cursor: pointer;
        }

        .mode span {
            display: block;
            text-align: center;
            padding: 0.6rem;
            border: 2px solid var(--line);
            border-radius: 8px;
            font-weight: 700;
        }

        .mode input:checked+span {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
        }

        .mode input:focus-visible+span {
            outline: 3px solid var(--t0);
            outline-offset: 2px;
        }

        .waiting {
            display: grid;
            gap: 12px;
            max-width: 420px;
            background: var(--paper);
            border: 2px solid var(--line);
            border-radius: 10px;
            padding: 18px;
        }

        .waiting h2 {
            font: 800 1.5rem/1.15 var(--f-display);
            margin: 0;
        }

        .waiting ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }

        .waiting li {
            background: var(--bg);
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .code {
            font-family: var(--f-mono);
            font-weight: 600;
            letter-spacing: 0.12em;
            background: var(--paper);
            border: 2px solid var(--line);
            border-radius: 6px;
            padding: 2px 8px;
        }

        .waiting .code {
            font-size: 1.6rem;
            background: var(--bg);
            justify-self: start;
        }

        /* game */
        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: baseline;
        }

        .timer {
            font-family: var(--f-mono);
            font-weight: 600;
        }

        .board {
            display: grid;
            gap: 20px;
            grid-template-columns: minmax(0, 1fr);
        }

        @media (min-width: 860px) {
            .board {
                grid-template-columns: minmax(0, 1fr) 300px;
                column-gap: 28px;
            }
        }

        .main {
            display: grid;
            gap: 12px;
            min-width: 0;
            align-content: start;
        }

        .msg {
            margin: 0;
            min-height: 1.6em;
            font-weight: 500;
        }

        .msg.tt {
            color: var(--tct);
        }

        .picked {
            margin: 0;
            min-height: 1.5em;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .keys {
            margin: 0;
            font-size: 0.9rem;
            color: var(--muted);
        }

        kbd {
            font-family: var(--f-mono);
            font-size: 0.85em;
            background: var(--paper);
            border: 1.5px solid var(--line);
            border-radius: 4px;
            padding: 0 5px;
        }

        .grid {
            container-type: inline-size;
            display: grid;
            grid-template-columns: repeat(var(--n, 12), 1fr);
            aspect-ratio: 1;
            width: 100%;
            max-width: 640px;
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 6px;
            overflow: hidden;
            user-select: none;
        }

        .cell {
            position: relative;
            display: grid;
            place-items: center;
            font-family: var(--f-mono);
            font-weight: 600;
            font-size: calc(100cqw / var(--n, 12) * 0.5);
            line-height: 1;
            box-shadow: inset 0 0 0 0.5px var(--line);
        }

        .cell.f {
            background: var(--tc);
            color: #fff;
        }

        .cell.anch {
            box-shadow: inset 0 0 0 3px var(--ac);
        }

        .cell.sel {
            background: var(--sel);
            box-shadow: inset 0 0 0 2px var(--ink);
            color: var(--ink);
        }

        .av {
            position: absolute;
            top: calc(4% + var(--rw, 0) * 30%);
            right: calc(4% + var(--k, 0) * 30%);
            width: 44%;
            height: 44%;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font: 700 calc(100cqw / var(--n, 12) * 0.26) var(--f-body);
            font-style: normal;
            color: #fff;
            background: var(--tcd);
            border: 2px solid var(--paper);
            z-index: 1;
        }

        .av.me {
            border-color: var(--ink);
            box-shadow: 0 0 0 2px var(--paper);
            z-index: 2;
        }

        .av.drop {
            animation: drop 0.6s cubic-bezier(.3, 1.4, .5, 1);
        }

        @keyframes drop {
            from {
                transform: translateY(-420%);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .av.drop {
                animation: none;
            }
        }

        .side {
            display: grid;
            gap: 16px;
            align-content: start;
            min-width: 0;
        }

        .teams {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .tbox {
            background: var(--paper);
            border: 2px solid var(--tc);
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 0;
            display: grid;
            gap: 2px;
            align-content: start;
        }

        .tbox .tl {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--tct);
            overflow-wrap: anywhere;
        }

        .tbox .sc {
            font: 800 2.4rem/1.05 var(--f-display);
            font-variant-numeric: tabular-nums;
            color: var(--tct);
        }

        .tbox .pl {
            font-size: 0.9rem;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .words h2 {
            font: 700 1.1rem var(--f-display);
            margin: 0 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .words h2 span {
            font: 500 0.85rem var(--f-body);
            color: var(--muted);
        }

        .words ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        @media (min-width: 860px) {
            .words ul {
                grid-template-columns: 1fr;
            }
        }

        .words li {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: var(--paper);
            border: 1.5px solid var(--line);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .words .w {
            font-family: var(--f-mono);
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .words .n {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .words li.f {
            border-color: var(--tc);
            color: var(--tct);
        }

        .words li.f .w {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .words li.f .n {
            color: inherit;
        }

        .result {
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 10px;
            padding: 14px;
            display: grid;
            gap: 10px;
            justify-items: start;
        }

        .result p {
            margin: 0;
            font: 800 1.4rem/1.15 var(--f-display);
        }
    </style>
</head>

<body>
    <main class="app">
        <h1>Word Duel</h1>

        <form class="join" id="join">
            <div class="field">
                <label for="name">Your name</label>
                <input id="name" maxlength="14" autocomplete="off" required>
            </div>
            <fieldset class="modes">
                <legend hidden>Room</legend>
                <label class="mode"><input type="radio" name="mode" value="create" checked><span>Create
                        room</span></label>
                <label class="mode"><input type="radio" name="mode" value="join"><span>Join room</span></label>
            </fieldset>
            <div id="createFields" class="field">
                <label for="size">Players</label>
                <select id="size">
                    <option value="1">1 player</option>
                    <option value="2">2 players</option>
                    <option value="3">3 players</option>
                    <option value="4" selected>4 players (2 teams)</option>
                    <option value="6">6 players (3 teams)</option>
                    <option value="8">8 players (4 teams)</option>
                </select>
                <p class="hint" id="sizeHint"></p>
            </div>
            <div id="joinFields" class="field" hidden>
                <label for="code">Room code</label>
                <input id="code" maxlength="8" autocomplete="off" placeholder="For example K7QF">
            </div>
            <p class="err" id="joinErr" role="alert"></p>
            <button class="btn" type="submit" id="goBtn">Create room</button>
        </form>

        <section id="game" hidden>
            <div class="bar">
                <span>Room <span class="code" id="roomCode"></span></span>
                <span class="hint">Share this code with the other players.</span>
                <span class="timer" id="timerWrap" hidden>Time <span id="timer">0:00</span></span>
            </div>
            <p class="err" id="connMsg" role="status"></p>

            <div class="waiting" id="waiting" hidden>
                <h2>Waiting for players <span id="wCount"></span></h2>
                <span class="code" id="wCode"></span>
                <ul id="wList"></ul>
                <p class="hint" id="wMode"></p>
            </div>

            <div class="board" id="board" hidden>
                <div class="main">
                    <div class="grid" id="grid" aria-label="Letter grid"></div>
                    <p class="picked" id="picked" aria-live="polite"></p>
                    <p class="keys"><kbd>Arrows</kbd> move &nbsp; <kbd>Space</kbd> pick or deselect the letter you are
                        on. A word counts once all its letters are picked &nbsp; <kbd>Esc</kbd> clears all</p>
                    <div class="result" id="result" hidden>
                        <p id="resultText"></p>
                        <button class="btn" type="button" id="again">Play again</button>
                    </div>
                </div>
                <aside class="side">
                    <div class="teams" id="teams"></div>
                    <div class="words">
                        <h2>Words to find <span id="left"></span></h2>
                        <ul id="wordList"></ul>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const TEAM_NAMES = ['Indigo', 'Amber', 'Teal', 'Rose'];
        let ws = null, S = null, seen = new Set(), lastRound = -1;

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }
        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function fmt(sec) {
            sec = Math.max(0, Math.floor(sec));
            return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        }

        function modeText(n) {
            if (n === 1) return 'Solo. Find every word on your own.';
            if (n < 4) return 'Everyone plays alone on their own board, racing to find all the words first.';
            return `Teams of 2. Each team has its own board with the same words, and the first team to find them all wins. The first two to join are a team, then the next two, and so on.`;
        }

        /* ---------- lobby ---------- */
        try { $('name').value = localStorage.getItem('wd-name') || ''; } catch (err) { }

        function currentMode() { return document.querySelector('input[name=mode]:checked').value; }
        function updateLobby() {
            const create = currentMode() === 'create';
            $('createFields').hidden = !create;
            $('joinFields').hidden = create;
            $('goBtn').textContent = create ? 'Create room' : 'Join room';
            $('sizeHint').textContent = modeText(+$('size').value);
            $('joinErr').textContent = '';
        }
        document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', updateLobby));
        $('size').addEventListener('change', updateLobby);
        updateLobby();

        $('join').addEventListener('submit', e => {
            e.preventDefault();
            const name = $('name').value.trim() || 'Player';
            try { localStorage.setItem('wd-name', name); } catch (err) { }
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const base = `${proto}://${location.host}/ws`;
            const q = `name=${encodeURIComponent(name)}`;
            if (currentMode() === 'create') {
                connect(`${base}/create?${q}&size=${$('size').value}`);
            } else {
                const code = $('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!code) { $('joinErr').textContent = 'Enter the room code.'; return; }
                connect(`${base}/join/${code}?${q}`);
            }
        });

        function connect(url) {
            $('joinErr').textContent = '';
            ws = new WebSocket(url);
            ws.onmessage = ev => {
                const m = JSON.parse(ev.data);
                if (m.type === 'error') { $('joinErr').textContent = m.text; return; }
                if (m.type === 'state') {
                    if (!S) { $('join').hidden = true; $('game').hidden = false; }
                    m.recv = performance.now();
                    S = m;
                    render();
                }
            };
            ws.onclose = () => {
                if (S) $('connMsg').textContent = 'Disconnected from the server. Reload the page to start again.';
                else if (!$('joinErr').textContent) $('joinErr').textContent = 'Could not connect to the server.';
            };
        }

        function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

        /* ---------- drawing ---------- */
        function teamLabel(t) {
            if (S.mode === 'teams') return TEAM_NAMES[t] + ' team';
            const names = S.teams[t].names;
            return names.length ? names[0] : TEAM_NAMES[t];
        }

        function updateTimer() {
            if (!S || !S.started) return;
            const t = S.over ? S.elapsed : S.elapsed + (performance.now() - S.recv) / 1000;
            $('timer').textContent = fmt(t);
        }
        setInterval(updateTimer, 500);

        function renderWaiting() {
            $('wCount').textContent = `(${S.players.length} of ${S.capacity})`;
            $('wCode').textContent = S.code;
            const ul = $('wList');
            ul.innerHTML = '';
            S.players.forEach(p => ul.append(el('li', '', p.name + (p.id === S.you ? ' (you)' : ''))));
            $('wMode').textContent = modeText(S.capacity) + ' The game starts when the room is full.';
        }

        function render() {
            $('roomCode').textContent = S.code;
            $('waiting').hidden = S.started;
            $('board').hidden = !S.started;
            $('timerWrap').hidden = !S.started;
            if (!S.started) { renderWaiting(); return; }
            updateTimer();

            const n = S.size, mt = S.myTeam;
            const grid = $('grid');
            grid.style.setProperty('--n', n);
            if (S.round !== lastRound) { seen = new Set(); lastRound = S.round; }

            // Only your own team's board is sent: its found words, its players and its picks.
            const foundCells = new Set();
            for (const f of S.found) for (const [r, c] of f.cells) foundCells.add(r * n + c);

            const me = S.players.find(p => p.id === S.you);
            const sel = new Set();
            if (me) me.picked.forEach(([r, c]) => sel.add(r * n + c));
            const mates = new Set();
            S.players.forEach(p => {
                if (p.id !== S.you) p.picked.forEach(([r, c]) => mates.add(r * n + c));
            });
            const at = {};
            S.players.forEach(p => { (at[p.r * n + p.c] = at[p.r * n + p.c] || []).push(p); });

            let html = '';
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    const k = r * n + c;
                    let cls = 'cell';
                    if (foundCells.has(k)) cls += ' f t' + mt;
                    if (mates.has(k)) cls += ' anch a' + mt;
                    if (sel.has(k)) cls += ' sel';
                    const avs = (at[k] || []).map((p, i) =>
                        `<i class="av t${mt}${p.id === S.you ? ' me' : ''}${seen.has(p.id) ? '' : ' drop'}" style="--k:${i % 3};--rw:${Math.floor(i / 3)}">${esc((p.name[0] || '?').toUpperCase())}</i>`
                    ).join('');
                    html += `<div class="${cls}">${esc(S.grid[r][c])}${avs}</div>`;
                }
            }
            grid.innerHTML = html;
            S.players.forEach(p => seen.add(p.id));

            const msg = $('msg');
            msg.className = 'msg tt t' + mt;
            msg.textContent = S.message;

            const letters = me ? me.picked.map(([r, c]) => S.grid[r][c]).join(' ') : '';
            $('picked').textContent = letters ? 'Your letters: ' + letters : 'Your letters: none yet';

            // Progress of every team. You see how many words the others have, not which ones.
            const teams = $('teams');
            teams.innerHTML = '';
            for (const T of S.teams) {
                const box = el('div', 't' + T.team + ' tbox');
                const label = teamLabel(T.team) + (T.team === mt ? ' (you)' : '');
                box.append(el('span', 'tl', label), el('span', 'sc', `${T.found}/${S.words.length}`));
                if (S.mode === 'teams') box.append(el('span', 'pl', T.names.join(', ')));
                if (T.done) box.append(el('span', 'pl', 'Finished'));
                teams.append(box);
            }

            const ul = $('wordList');
            ul.innerHTML = '';
            let left = 0;
            for (const w of S.words) {
                const li = el('li', w.found ? 'f t' + mt : '');
                if (!w.found) left++;
                li.append(el('span', 'w', w.word), el('span', 'n', String(w.word.length)));
                ul.append(li);
            }
            $('left').textContent = left + ' left';

            $('result').hidden = !S.over;
            if (S.over) {
                const time = fmt(S.elapsed);
                let text;
                if (S.mode === 'solo') text = `All words found in ${time}.`;
                else if (S.winner === mt) text = `${S.mode === 'teams' ? 'Your team wins' : 'You win'} in ${time}.`;
                else text = `${teamLabel(S.winner)} wins in ${time}.`;
                $('resultText').textContent = text;
            }
        }

        /* ---------- keyboard ---------- */
        const MOVES = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
        document.addEventListener('keydown', e => {
            if (!S || !S.started || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (MOVES[e.key]) {
                e.preventDefault();
                // Step up then right to reach a diagonal neighbour.
                send({ type: 'move', dx: MOVES[e.key][0], dy: MOVES[e.key][1] });
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (!e.repeat) send({ type: 'select' });
            } else if (e.key === 'Escape') {
                send({ type: 'cancel' });
            }
        });
        $('again').addEventListener('click', () => send({ type: 'restart' }));
    </script>
</body>

</html>
